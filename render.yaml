services:
  - type: web
    name: coded-outsourcing-bot
    runtime: python
    repo: https://github.com/ваш-логин/ваш-репозиторий
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python outsourcing_bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false